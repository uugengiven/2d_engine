<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FM Synth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #090912;
      color: #c0cce0;
      font-family: 'Courier New', monospace;
      padding: 28px 24px;
    }

    h1 {
      font-size: 1.1rem;
      color: #6ab8f0;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 0.72rem;
      color: #3a4a5e;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    /* ── controls row ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ctrl label {
      font-size: 0.68rem;
      color: #566880;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      background: #111120;
      border: 1px solid #253050;
      color: #c0cce0;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #6ab8f0; }

    input[type=range] {
      width: 110px;
      cursor: pointer;
      accent-color: #6ab8f0;
    }

    .val {
      font-size: 0.8rem;
      color: #6ab8f0;
      min-width: 36px;
      text-align: right;
      cursor: text;
      border-radius: 2px;
      padding: 1px 3px;
      transition: background 0.1s;
    }
    .val:hover { background: #161828; }
    .val-input {
      width: 56px;
      background: #111120;
      border: 1px solid #6ab8f0;
      color: #6ab8f0;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 1px 4px;
      border-radius: 2px;
      text-align: right;
    }

    button {
      background: #111120;
      border: 1px solid #253050;
      color: #6ab8f0;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    button:hover   { background: #1a1e38; border-color: #6ab8f0; }
    button.playing { border-color: #f06a6a; color: #f06a6a; }

    /* ── editor panels ── */
    .editor {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .panel {
      background: #0e0e1a;
      border: 1px solid #1e2438;
      border-radius: 4px;
      padding: 14px 16px;
      min-width: 220px;
    }

    .panel-title {
      font-size: 0.65rem;
      color: #3a6a9a;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .panel-title-row span {
      font-size: 0.65rem;
      color: #3a6a9a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .op-remove-btn {
      background: transparent;
      border: 1px solid #2a3550;
      color: #566880;
      font-size: 0.85rem;
      line-height: 1;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }
    .op-remove-btn:hover:not(:disabled) { border-color: #f06a6a; color: #f06a6a; }
    .op-remove-btn:disabled { opacity: 0.25; cursor: default; }

    .op-add-btn {
      align-self: flex-start;
      margin-top: 4px;
      background: #111120;
      border: 1px dashed #2a4a30;
      color: #4a9a5a;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px 18px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    .op-add-btn:hover:not(:disabled) { background: #121a14; border-color: #5db87a; color: #5db87a; }
    .op-add-btn:disabled { opacity: 0.25; cursor: default; }

    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .param-row label {
      font-size: 0.65rem;
      color: #566880;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-width: 68px;
    }

    .param-row input[type=range] {
      width: 90px;
      flex-shrink: 0;
    }

    .param-row .val {
      min-width: 44px;
      font-size: 0.75rem;
    }

    /* ── routing section ── */
    .routing-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .routing-header h2 {
      margin-bottom: 0;
    }

    .template-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .template-controls label {
      font-size: 0.65rem;
      color: #566880;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .algo-panel {
      background: #0e0e1a;
      border: 1px solid #1e2438;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    #algo-diagram {
      font-size: 0.72rem;
      color: #6ab8f0;
      white-space: pre;
      line-height: 1.7;
      min-width: 200px;
    }

    /* ── per-operator routing ── */
    .routes-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .route-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: #8ab0cc;
      cursor: pointer;
      user-select: none;
    }

    .route-item input[type=checkbox] {
      accent-color: #6ab8f0;
      cursor: pointer;
      width: 13px;
      height: 13px;
    }

    .param-row select {
      font-size: 0.72rem;
      padding: 3px 6px;
    }

    /* ── tooltips ── */
    [data-tip] {
      position: relative;
      cursor: help;
      text-decoration: underline dotted #3a5070;
      text-underline-offset: 3px;
    }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 230px;
      background: #111828;
      border: 1px solid #3a5070;
      color: #8ab0cc;
      font-size: 0.65rem;
      line-height: 1.55;
      padding: 7px 10px;
      border-radius: 4px;
      pointer-events: none;
      white-space: normal;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 200;
    }
    [data-tip]:hover::after { opacity: 1; }

    /* ── keyboard ── */
    .kb-label {
      font-size: 0.65rem;
      color: #3a4a5e;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .kb-wrap {
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    #keyboard {
      position: relative;
      display: inline-block;
      user-select: none;
    }

    .key {
      position: absolute;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      transition: background 0.04s;
    }
    .white-key {
      background: #d0d8e4;
      border: 1px solid #3a4a5e;
      z-index: 0;
    }
    .white-key:hover  { background: #e2eaf5; }
    .white-key.pressed { background: #6ab8f0; }

    .black-key {
      background: #161828;
      border: 1px solid #090912;
      z-index: 1;
    }
    .black-key:hover  { background: #252845; }
    .black-key.pressed { background: #3a7aaa; }

    /* ── export ── */
    .export-wrap {
      margin-top: 20px;
    }

    #json-out {
      display: block;
      width: 100%;
      max-width: 700px;
      height: 180px;
      background: #0e0e1a;
      border: 1px solid #1e2438;
      color: #8ab8d8;
      font-family: inherit;
      font-size: 0.72rem;
      padding: 10px;
      border-radius: 4px;
      resize: vertical;
      margin-top: 10px;
    }

    /* ── status ── */
    #status {
      margin-top: 22px;
      font-size: 0.72rem;
      color: #3a4a5e;
    }
    #status .ok  { color: #5db87a; }
    #status .err { color: #f06a6a; }

    .row-badge {
      font-size: 0.75rem;
      color: #3a4a5e;
      min-width: 70px;
    }
    .row-badge span { color: #6ab8f0; }
  </style>
</head>
<body>
  <h1>FM Synth</h1>

  <!-- ── top controls ── -->
  <div class="controls">
    <div class="ctrl">
      <label>Instrument</label>
      <select id="inst-sel">
        <optgroup label="Classic FM">
          <option value="0">FM Bell</option>
          <option value="1">FM Electric Piano</option>
          <option value="2">FM Bass</option>
          <option value="3">FM Brass</option>
        </optgroup>
        <optgroup label="Genesis (YM2612)">
          <option value="4">Gen Bass</option>
          <option value="5">Gen Lead</option>
          <option value="6">Gen Strings</option>
          <option value="7">Gen Organ</option>
        </optgroup>
        <optgroup label="SNES / PSX">
          <option value="8">SNES Piano</option>
          <option value="9">SNES Strings</option>
          <option value="10">SNES Flute</option>
          <option value="11">SNES Choir</option>
        </optgroup>
      </select>
    </div>

    <div class="ctrl">
      <label>Volume</label>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.75">
      <span class="val" id="vol-val">0.75</span>
    </div>

    <div class="ctrl">
      <label>BPM</label>
      <input type="range" id="bpm" min="60" max="240" step="1" value="120">
      <span class="val" id="bpm-val">120</span>
    </div>

    <button id="play-btn">▶ Play</button>
    <div class="row-badge">row <span id="row-num">--</span></div>
  </div>

  <!-- ── routing diagram + template ── -->
  <div class="routing-header">
    <h2>Routing</h2>
    <div class="template-controls">
      <label>New from template</label>
      <select id="template-sel">
        <option value="">— choose —</option>
        <option value="0">1-op sine (carrier)</option>
        <option value="1">2-op serial (M→C)</option>
        <option value="2">2-op parallel (C+C)</option>
        <option value="3">3-op serial (M→M→C)</option>
        <option value="4">3-op (M→C) + free C</option>
        <option value="5">4-op  2×2 stacks</option>
        <option value="6">4-op all carriers</option>
      </select>
      <button id="apply-template-btn">Apply</button>
    </div>
  </div>
  <div class="algo-panel">
    <pre id="algo-diagram"></pre>
  </div>

  <!-- ── operator editors ── -->
  <h2>Operators</h2>
  <div class="editor" id="op-editor"></div>

  <!-- ── LFO editors ── -->
  <h2 style="margin-top:20px">LFOs</h2>
  <div class="editor" id="lfo-editor"></div>

  <!-- ── output filter ── -->
  <h2 style="margin-top:20px">Output Filter</h2>
  <div class="panel" id="filter-panel" style="max-width:420px"></div>

  <!-- ── keyboard ── -->
  <div class="kb-label">Keyboard &nbsp;·&nbsp; C3 – C7</div>
  <div class="kb-wrap">
    <div id="keyboard"></div>
  </div>

  <!-- ── export ── -->
  <div class="export-wrap">
    <button id="export-btn">Export JSON</button>
    <button id="copy-btn" style="margin-left:8px">Copy</button>
    <textarea id="json-out" spellcheck="false" readonly></textarea>
  </div>

  <div id="status">Loading instruments…</div>

  <script type="module">
    import { AudioManager } from '../engine/audio.js';
    import { Sequencer }    from '../engine/sequencer.js';
    import { FmSynth }      from '../engine/fm-synth.js';

    // ── templates (starting points only — not live parameters) ──────────────
    const TEMPLATES = [
      { label: '1-op sine',         ops: 1, connections: [] },
      { label: '2-op serial M→C',   ops: 2, connections: [[0, 1]] },
      { label: '2-op parallel C+C', ops: 2, connections: [] },
      { label: '3-op serial M→M→C', ops: 3, connections: [[0, 1], [1, 2]] },
      { label: '3-op M→C + free C', ops: 3, connections: [[0, 1]] },
      { label: '4-op 2×2 stacks',   ops: 4, connections: [[0, 1], [2, 3]] },
      { label: '4-op all carriers', ops: 4, connections: [] },
    ];

    const DEFAULT_OP = {
      ratio: 1.0, detune: 0, level: 1.0, feedback: 0,
      envelope: { attack: 0.001, decay: 0.3, sustain: 0.0, decay2: 0, release: 0.1 },
    };

    // ── diagram ───────────────────────────────────────────────────────────────
    function buildDiagram(def) {
      const ops  = def.operators ?? [];
      const algo = def.algorithm ?? [];
      if (ops.length === 0) return '(no operators)';
      const lines = [];
      for (let oi = 0; oi < ops.length; oi++) {
        const modDests = [];
        let toOut   = false;
        let hasConn = false;
        for (const [s, d] of algo) {
          if (s !== oi) continue;
          hasConn = true;
          if (d < 0) toOut = true;
          else modDests.push(d);
        }
        if (!hasConn) toOut = true; // implicit carrier
        const parts = [
          ...modDests.map(d => `OP${d}`),
          ...(toOut ? ['OUT'] : []),
        ];
        lines.push(`OP${oi}  ──▶  ${parts.join('  +  ')}`);
      }
      return lines.join('\n');
    }

    function refreshDiagram(def) {
      document.getElementById('algo-diagram').textContent = buildDiagram(def);
    }

    // ── live instrument definitions (editable copies) ─────────────────────────
    const INST_URLS = [
      '../instruments/fm-bell.json',           // 0
      '../instruments/fm-electric-piano.json', // 1
      '../instruments/fm-bass.json',           // 2
      '../instruments/fm-brass.json',          // 3
      '../instruments/genesis-bass.json',      // 4
      '../instruments/genesis-lead.json',      // 5
      '../instruments/genesis-strings.json',   // 6
      '../instruments/genesis-organ.json',     // 7
      '../instruments/snes-piano.json',        // 8
      '../instruments/snes-strings.json',      // 9
      '../instruments/snes-flute.json',        // 10
      '../instruments/snes-choir.json',        // 11
    ];

    let instDefs   = [];   // raw parsed JSON, one per instrument
    let instruments = [];  // FmSynth instances
    let activeIdx  = 0;

    // ── audio setup ───────────────────────────────────────────────────────────
    const audio = new AudioManager();
    audio.createChannel('fm', { volume: 0.9 });

    let audioReady = false;
    async function ensureAudio() {
      if (!audioReady) { await audio.resume(); audioReady = true; }
    }

    try {
      const pairs = await Promise.all(
        INST_URLS.map(async url => {
          const res = await fetch(url);
          const def = await res.json();
          return def;
        })
      );
      instDefs = pairs;

      instruments = await Promise.all(
        instDefs.map(def => {
          // Construct FmSynth directly from the preloaded def
          return audio.loadFmInstrument
            ? null   // will fill after worklet loads
            : null;
        })
      );

      // Load worklet once, then build all synths
      await audio.loadFmWorklet();
      const ctx = audio.context;
      const ch  = audio.getChannel('fm');
      instruments = instDefs.map(def => new FmSynth(ctx, ch, def));

      document.getElementById('status').innerHTML =
        '<span class="ok">Instruments loaded.</span> Click keys or press Play.';
    } catch(e) {
      document.getElementById('status').innerHTML =
        `<span class="err">Load error: ${e.message}</span>`;
      throw e;
    }

    // ── sequencer demo ────────────────────────────────────────────────────────
    const seq = new Sequencer(audio.context);
    seq.bpm = 120;

    function buildPattern() {
      const inst = instruments[activeIdx];
      return {
        ticksPerBeat: 4,
        length: 32,
        tracks: [
          {
            id: 'fm',
            instrument: inst,
            events: [
              { row:  0, note: 60, velocity: 0.85, length: 2 },
              { row:  3, note: 64, velocity: 0.80, length: 1 },
              { row:  4, note: 67, velocity: 0.80, length: 2 },
              { row:  7, note: 64, velocity: 0.75, length: 1 },
              { row:  8, note: 69, velocity: 0.85, length: 3 },
              { row: 12, note: 67, velocity: 0.80, length: 1 },
              { row: 13, note: 65, velocity: 0.80, length: 1 },
              { row: 14, note: 64, velocity: 0.75, length: 2 },
              { row: 16, note: 60, velocity: 0.85, length: 2 },
              { row: 19, note: 62, velocity: 0.80, length: 1 },
              { row: 20, note: 65, velocity: 0.80, length: 2 },
              { row: 24, note: 67, velocity: 0.85, length: 4 },
              { row: 28, note: 64, velocity: 0.80, length: 1 },
              { row: 29, note: 62, velocity: 0.75, length: 1 },
              { row: 30, note: 60, velocity: 0.85, length: 2 },
            ],
          },
        ],
      };
    }

    seq.setPattern(buildPattern());

    // ── operator editor UI ────────────────────────────────────────────────────
    const OP_PARAMS = [
      { key: 'ratio',    label: 'Ratio',    min: 0.25, max: 16,  step: 0.01, fmt: v => v.toFixed(2),
        tip: 'Frequency multiplier relative to the note pitch. Whole numbers (1, 2, 3…) give harmonic tones; fractional values (1.5, 3.5…) give inharmonic, bell-like timbres.' },
      { key: 'detune',   label: 'Detune',   min: -100, max: 100, step: 1,    fmt: v => (v > 0 ? '+' : '') + v,
        tip: 'Fine pitch offset in cents (100 cents = 1 semitone). Small values on parallel operators create chorus-like thickening.' },
      { key: 'level',    label: 'Level',    min: 0,    max: 8,   step: 0.01, fmt: v => v.toFixed(2),
        tip: 'Output amplitude. On a modulator, higher = more intense modulation = brighter/more complex tone. On a carrier, controls loudness.' },
      { key: 'feedback', label: 'Feedback', min: 0,    max: 1,   step: 0.01, fmt: v => v.toFixed(2),
        tip: 'Self-modulation — feeds the operator\'s own output back as phase input. Low values add odd harmonics; high values create buzzy or noise-like tones.' },
    ];
    const ENV_PARAMS = [
      { key: 'attack',  label: 'Attack',  min: 0.001, max: 2,   step: 0.001, fmt: v => v.toFixed(3),
        tip: 'Time from note start to peak amplitude, in seconds.' },
      { key: 'decay',   label: 'Decay',   min: 0.001, max: 4,   step: 0.001, fmt: v => v.toFixed(3),
        tip: 'Time to fall from peak down to the sustain level, in seconds.' },
      { key: 'sustain', label: 'Sustain', min: 0,     max: 1,   step: 0.01,  fmt: v => v.toFixed(2),
        tip: 'Level held while the key is down. 0 = silent after decay, 1 = stays at full velocity level.' },
      { key: 'decay2',  label: 'Decay2',  min: 0,     max: 4,   step: 0.01,  fmt: v => v.toFixed(2),
        tip: 'Slow exponential fade during sustain — simulates acoustic instruments that keep decaying even while held. 0 = off.' },
      { key: 'release', label: 'Release', min: 0.001, max: 4,   step: 0.001, fmt: v => v.toFixed(3),
        tip: 'Time to fade to silence after the key is released, in seconds.' },
    ];

    function makeSlider(paramDef, getValue, setValue) {
      const row = document.createElement('div');
      row.className = 'param-row';

      const lbl = document.createElement('label');
      lbl.textContent = paramDef.label;
      if (paramDef.tip) lbl.dataset.tip = paramDef.tip;

      // log-scale support: slider operates 0–1000 internally, maps to min–max exponentially
      const log      = !!paramDef.log;
      const logRatio = log ? Math.log(paramDef.max / paramDef.min) : 1;
      const toSlider   = log ? v => Math.round(Math.log(v / paramDef.min) / logRatio * 1000) : v => v;
      const fromSlider = log ? s => paramDef.min * Math.exp((s / 1000) * logRatio)            : s => parseFloat(s);

      const slider = document.createElement('input');
      slider.type  = 'range';
      slider.min   = log ? 0    : paramDef.min;
      slider.max   = log ? 1000 : paramDef.max;
      slider.step  = log ? 1    : paramDef.step;
      slider.value = toSlider(getValue());

      const valEl = document.createElement('span');
      valEl.className = 'val';
      valEl.textContent = paramDef.fmt(getValue());

      slider.addEventListener('input', () => {
        const v = fromSlider(parseFloat(slider.value));
        setValue(v);
        valEl.textContent = paramDef.fmt(v);
      });

      valEl.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'number';
        input.className = 'val-input';
        input.value = getValue();
        input.min = paramDef.min;
        input.max = paramDef.max;
        input.step = paramDef.step;
        valEl.textContent = '';
        valEl.appendChild(input);
        input.focus();
        input.select();
        let cancelled = false;
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter')  { input.blur(); }
          if (e.key === 'Escape') { cancelled = true; input.blur(); }
        });
        input.addEventListener('blur', () => {
          if (cancelled) { valEl.textContent = paramDef.fmt(getValue()); return; }
          let v = parseFloat(input.value);
          if (isNaN(v)) v = getValue();
          v = Math.min(paramDef.max, Math.max(paramDef.min, v));
          setValue(v);
          slider.value = toSlider(v);
          valEl.textContent = paramDef.fmt(v);
        });
      });

      row.appendChild(lbl);
      row.appendChild(slider);
      row.appendChild(valEl);
      return row;
    }

    function buildLfoTargets(opCount) {
      const t = [
        { value: 'pitch',  label: 'Pitch (vibrato)',  depthMax: 12, depthStep: 0.1,
          tip: 'Vibrato — shifts all operators\' frequencies together by the same amount, preserving timbre.' },
        { value: 'volume', label: 'Volume (tremolo)', depthMax: 2,  depthStep: 0.01,
          tip: 'Tremolo — pulses the overall output amplitude.' },
      ];
      for (let i = 0; i < opCount; i++) {
        t.push({ value: `op${i}.level`,    label: `Op ${i} · Level`,    depthMax: 4,  depthStep: 0.01,
          tip: `Pulses Op ${i}'s output level. On a modulator this creates rhythmic timbral changes; on a carrier it's amplitude tremolo for that voice alone.` });
        t.push({ value: `op${i}.ratio`,    label: `Op ${i} · Ratio`,    depthMax: 12, depthStep: 0.1,
          tip: `Modulates Op ${i}'s frequency. On a carrier = vibrato on that partial. On a modulator = spectral sweep that shifts timbre without necessarily changing perceived pitch.` });
        t.push({ value: `op${i}.feedback`, label: `Op ${i} · Feedback`, depthMax: 1,  depthStep: 0.01,
          tip: `Modulates Op ${i}'s self-feedback depth, creating evolving harmonic complexity and growl.` });
      }
      return t;
    }

    function buildOpEditor(def) {
      const container = document.getElementById('op-editor');
      container.innerHTML = '';
      if (!def.operators) def.operators = [];
      const ops = def.operators;

      ops.forEach((op, oi) => {
        if (!op.envelope) op.envelope = {};
        const panel = document.createElement('div');
        panel.className = 'panel';

        // ── title row with remove button ──
        const titleRow = document.createElement('div');
        titleRow.className = 'panel-title-row';
        const titleSpan = document.createElement('span');
        titleSpan.textContent = `Operator ${oi}`;
        const removeBtn = document.createElement('button');
        removeBtn.className = 'op-remove-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove operator';
        removeBtn.disabled = ops.length <= 1;
        removeBtn.addEventListener('click', () => {
          ops.splice(oi, 1);
          def.algorithm = (def.algorithm ?? [])
            .filter(([s, d]) => s !== oi && d !== oi)
            .map(([s, d]) => [s > oi ? s - 1 : s, d > oi ? d - 1 : d]);
          buildOpEditor(def);
          refreshDiagram(def);
        });
        titleRow.appendChild(titleSpan);
        titleRow.appendChild(removeBtn);
        panel.appendChild(titleRow);

        // ── synth params ──
        for (const p of OP_PARAMS) {
          panel.appendChild(makeSlider(p, () => op[p.key] ?? 0, v => { op[p.key] = v; }));
        }

        // ── envelope ──
        const envTitle = document.createElement('div');
        envTitle.className = 'panel-title';
        envTitle.style.marginTop = '10px';
        envTitle.textContent = 'Envelope';
        panel.appendChild(envTitle);

        const env = op.envelope;
        for (const p of ENV_PARAMS) {
          panel.appendChild(makeSlider(p, () => env[p.key] ?? 0, v => { env[p.key] = v; }));
        }

        // ── routing ──
        const routeTitle = document.createElement('div');
        routeTitle.className = 'panel-title';
        routeTitle.style.marginTop = '10px';
        routeTitle.textContent = 'Routes To';
        panel.appendChild(routeTitle);

        const routesRow = document.createElement('div');
        routesRow.className = 'routes-row';

        // Destinations: all other ops + OUT
        const destinations = [
          { dst: -1, label: 'OUT' },
          ...ops.map((_, di) => di !== oi ? { dst: di, label: `OP ${di}` } : null).filter(Boolean),
        ];

        for (const { dst, label } of destinations) {
          const opConns    = (def.algorithm ?? []).filter(([s]) => s === oi);
          const hasExplicit = opConns.some(([, d]) => d === dst);
          // OUT is implicitly checked when op has no connections at all
          const checked    = dst < 0 ? (hasExplicit || opConns.length === 0) : hasExplicit;

          const item = document.createElement('label');
          item.className = 'route-item';
          const chk = document.createElement('input');
          chk.type    = 'checkbox';
          chk.checked = checked;

          chk.addEventListener('change', () => {
            if (!def.algorithm) def.algorithm = [];
            if (chk.checked) {
              // Add connection if not already present
              if (!def.algorithm.some(([s, d]) => s === oi && d === dst)) {
                def.algorithm.push([oi, dst]);
              }
            } else {
              // Guard: op must keep at least one destination
              const afterRemove = def.algorithm.filter(([s, d]) => !(s === oi && d === dst));
              const stillHasDest = afterRemove.some(([s]) => s === oi);
              if (!stillHasDest) {
                chk.checked = true;
                return;
              }
              def.algorithm = afterRemove;
            }
            refreshDiagram(def);
          });

          item.appendChild(chk);
          item.appendChild(document.createTextNode(' ' + label));
          routesRow.appendChild(item);
        }

        panel.appendChild(routesRow);
        container.appendChild(panel);
      });

      // ── add operator button (max 4) ──
      const addBtn = document.createElement('button');
      addBtn.className = 'op-add-btn';
      addBtn.textContent = '+ Operator';
      addBtn.disabled = ops.length >= 4;
      addBtn.addEventListener('click', () => {
        ops.push(JSON.parse(JSON.stringify(DEFAULT_OP)));
        buildOpEditor(def);
        refreshDiagram(def);
      });
      container.appendChild(addBtn);
      buildLfoEditor(def);
    }

    function buildLfoEditor(def) {
      const container = document.getElementById('lfo-editor');
      container.innerHTML = '';
      if (!def.lfos) def.lfos = [];
      const lfos    = def.lfos;
      const targets = buildLfoTargets((def.operators ?? []).length);

      lfos.forEach((lfo, li) => {
        const panel = document.createElement('div');
        panel.className = 'panel';

        const titleRow = document.createElement('div');
        titleRow.className = 'panel-title-row';
        const titleSpan = document.createElement('span');
        titleSpan.textContent = `LFO ${li}`;
        const removeBtn = document.createElement('button');
        removeBtn.className = 'op-remove-btn';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => { lfos.splice(li, 1); buildLfoEditor(def); });
        titleRow.append(titleSpan, removeBtn);
        panel.appendChild(titleRow);

        // target
        const targetRow = document.createElement('div');
        targetRow.className = 'param-row';
        const targetLbl = document.createElement('label');
        targetLbl.textContent = 'Target';
        targetLbl.dataset.tip = 'Which parameter this LFO modulates. Hover each option in the list for a description.';
        const targetSel = document.createElement('select');
        for (const t of targets) {
          const opt = document.createElement('option');
          opt.value = t.value; opt.textContent = t.label;
          if (t.tip) opt.title = t.tip;
          if (t.value === (lfo.target ?? 'pitch')) opt.selected = true;
          targetSel.appendChild(opt);
        }
        targetRow.append(targetLbl, targetSel);
        panel.appendChild(targetRow);

        // waveform
        const waveRow = document.createElement('div');
        waveRow.className = 'param-row';
        const waveLbl = document.createElement('label');
        waveLbl.textContent = 'Waveform';
        waveLbl.dataset.tip = 'Shape of the LFO oscillation. Sine = smooth, Square = abrupt on/off, Triangle = linear ramp, Sawtooth = one-way sweep.';
        const waveSel = document.createElement('select');
        for (const w of ['sine', 'square', 'triangle', 'sawtooth']) {
          const opt = document.createElement('option');
          opt.value = w; opt.textContent = w[0].toUpperCase() + w.slice(1);
          if (w === (lfo.waveform ?? 'sine')) opt.selected = true;
          waveSel.appendChild(opt);
        }
        waveSel.addEventListener('change', () => { lfo.waveform = waveSel.value; });
        waveRow.append(waveLbl, waveSel);
        panel.appendChild(waveRow);

        // rate
        panel.appendChild(makeSlider(
          { label: 'Rate',  min: 0.1, max: 20, step: 0.1,  fmt: v => v.toFixed(1) + ' Hz',
            tip: 'LFO speed in cycles per second. 0.1 = slow sweep, 5–8 = typical vibrato/tremolo.' },
          () => lfo.rate  ?? 5,
          v  => { lfo.rate  = v; }
        ));

        // depth — range is context-sensitive to target
        const curTgt   = targets.find(t => t.value === (lfo.target ?? 'pitch')) ?? targets[0];
        const depthRow = makeSlider(
          { label: 'Depth', min: 0, max: curTgt.depthMax, step: curTgt.depthStep, fmt: v => v.toFixed(2),
            tip: 'Intensity of the effect. Units depend on target: semitones for pitch/ratio, amplitude multiplier for volume/level, raw amount for feedback.' },
          () => lfo.depth ?? 0.5,
          v  => { lfo.depth = v; }
        );
        const depthSlider = depthRow.querySelector('input[type=range]');
        const depthValEl  = depthRow.querySelector('.val');
        panel.appendChild(depthRow);

        // delay
        panel.appendChild(makeSlider(
          { label: 'Delay', min: 0, max: 4, step: 0.01, fmt: v => v.toFixed(2) + ' s',
            tip: 'Seconds before the LFO fades in after the note starts. Useful for delayed vibrato that kicks in after the initial attack.' },
          () => lfo.delay ?? 0,
          v  => { lfo.delay = v; }
        ));

        // update depth range when target changes
        targetSel.addEventListener('change', () => {
          lfo.target = targetSel.value;
          const t = targets.find(t => t.value === lfo.target);
          if (t) {
            depthSlider.max  = t.depthMax;
            depthSlider.step = t.depthStep;
            if (+depthSlider.value > t.depthMax) {
              depthSlider.value    = t.depthMax;
              lfo.depth            = t.depthMax;
              depthValEl.textContent = t.depthMax.toFixed(2);
            }
          }
        });

        container.appendChild(panel);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'op-add-btn';
      addBtn.textContent = '+ LFO';
      addBtn.addEventListener('click', () => {
        lfos.push({ target: 'pitch', waveform: 'sine', rate: 5, depth: 0.5, delay: 0 });
        buildLfoEditor(def);
      });
      container.appendChild(addBtn);
    }

    function applyTemplate(templateIdx) {
      const t   = TEMPLATES[templateIdx];
      const def = instDefs[activeIdx];
      def.operators = Array.from({ length: t.ops }, () => JSON.parse(JSON.stringify(DEFAULT_OP)));
      // Build algorithm with explicit -1 for carriers
      def.algorithm = t.connections.map(c => [...c]);
      const modSrcs = new Set(t.connections.map(([s]) => s));
      for (let oi = 0; oi < t.ops; oi++) {
        if (!modSrcs.has(oi)) def.algorithm.push([oi, -1]);
      }
      def.lfos = [];
      loadInstrumentUI(activeIdx);
    }

    const FILTER_TYPES = [
      { value: 'allpass',  label: 'Off (allpass)',  tip: 'Passes all frequencies unchanged — filter is effectively bypassed.' },
      { value: 'lowpass',  label: 'Low Pass',       tip: 'Passes frequencies below the cutoff, rolls off higher ones. Great for darkening or removing harshness.' },
      { value: 'highpass', label: 'High Pass',       tip: 'Passes frequencies above the cutoff, rolls off lower ones. Useful for thinning out a bass-heavy sound.' },
      { value: 'bandpass', label: 'Band Pass',       tip: 'Passes a band of frequencies around the cutoff, attenuates everything else. Q controls the width of the band.' },
      { value: 'notch',    label: 'Notch',           tip: 'Cuts a narrow band of frequencies around the cutoff, passes everything else. Useful for removing a specific resonance.' },
    ];

    function buildFilterEditor(def) {
      const container = document.getElementById('filter-panel');
      container.innerHTML = '';
      if (!def.filter) def.filter = { type: 'allpass', frequency: 20000, Q: 1 };
      const flt = def.filter;

      const typeRow = document.createElement('div');
      typeRow.className = 'param-row';
      const typeLbl = document.createElement('label');
      typeLbl.textContent = 'Type';
      typeLbl.dataset.tip = 'Filter topology. Each shape attenuates different frequency regions.';
      const typeSel = document.createElement('select');
      for (const t of FILTER_TYPES) {
        const opt = document.createElement('option');
        opt.value = t.value; opt.textContent = t.label; opt.title = t.tip;
        if (t.value === (flt.type ?? 'allpass')) opt.selected = true;
        typeSel.appendChild(opt);
      }
      typeSel.addEventListener('change', () => {
        flt.type = typeSel.value;
        instruments[activeIdx]?.setFilter({ type: flt.type });
      });
      typeRow.append(typeLbl, typeSel);
      container.appendChild(typeRow);

      container.appendChild(makeSlider(
        { label: 'Frequency', min: 20, max: 20000, step: 1, log: true,
          fmt: v => Math.round(v) + ' Hz',
          tip: 'Cutoff frequency. The filter effect is centered here. Logarithmic scale — small movements at the left are fine adjustments in the low range.' },
        () => flt.frequency ?? 20000,
        v  => { flt.frequency = v; instruments[activeIdx]?.setFilter({ frequency: v }); }
      ));

      container.appendChild(makeSlider(
        { label: 'Q', min: 0.1, max: 20, step: 0.1,
          fmt: v => v.toFixed(1),
          tip: 'Resonance / quality factor. Higher values create a pronounced peak at the cutoff frequency. At extreme values some filter types will self-oscillate.' },
        () => flt.Q ?? 1,
        v  => { flt.Q = v; instruments[activeIdx]?.setFilter({ Q: v }); }
      ));
    }

    function loadInstrumentUI(idx) {
      activeIdx = idx;
      const def = instDefs[idx];
      refreshDiagram(def);
      buildOpEditor(def);
      buildFilterEditor(def);
    }

    // ── rebuild FmSynth from edited def ──────────────────────────────────────
    function rebuildInstrument(idx) {
      const old = instruments[idx];
      old?.dispose();
      const ctx = audio.context;
      const ch  = audio.getChannel('fm');
      instruments[idx] = new FmSynth(ctx, ch, instDefs[idx]);
      if (seq.running) {
        // hot-swap the live sequencer track
        const p = seq.currentPattern;
        if (p) {
          const track = p.tracks[0];
          if (track) track.instrument = instruments[idx];
        }
      }
    }

    // ── controls ──────────────────────────────────────────────────────────────
    document.getElementById('inst-sel').addEventListener('change', e => {
      loadInstrumentUI(+e.target.value);
    });

    document.getElementById('apply-template-btn').addEventListener('click', () => {
      const sel = document.getElementById('template-sel');
      const idx = parseInt(sel.value, 10);
      if (isNaN(idx)) return;
      applyTemplate(idx);
      sel.value = '';
    });

    const volSlider = document.getElementById('vol');
    const volVal    = document.getElementById('vol-val');
    volSlider.addEventListener('input', () => {
      audio.volume = +volSlider.value;
      volVal.textContent = (+volSlider.value).toFixed(2);
    });
    audio.volume = +volSlider.value;

    const bpmSlider = document.getElementById('bpm');
    const bpmVal    = document.getElementById('bpm-val');
    bpmSlider.addEventListener('input', () => {
      seq.bpm = +bpmSlider.value;
      bpmVal.textContent = bpmSlider.value;
    });

    const playBtn = document.getElementById('play-btn');
    playBtn.addEventListener('click', async () => {
      await ensureAudio();
      if (seq.running) {
        seq.stop();
        playBtn.textContent = '▶ Play';
        playBtn.classList.remove('playing');
      } else {
        // Rebuild the instrument from the latest edited def before playing
        rebuildInstrument(activeIdx);
        seq.setPattern(buildPattern());
        seq.start();
        playBtn.textContent = '■ Stop';
        playBtn.classList.add('playing');
      }
    });

    // ── row counter ───────────────────────────────────────────────────────────
    const rowNum = document.getElementById('row-num');
    (function tick() {
      rowNum.textContent = seq.running ? seq.currentRow : '--';
      requestAnimationFrame(tick);
    })();

    // ── export ────────────────────────────────────────────────────────────────
    document.getElementById('export-btn').addEventListener('click', () => {
      const def = instDefs[activeIdx];
      document.getElementById('json-out').value = JSON.stringify(def, null, 2);
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const ta = document.getElementById('json-out');
      if (!ta.value) {
        const def = instDefs[activeIdx];
        ta.value = JSON.stringify(def, null, 2);
      }
      navigator.clipboard.writeText(ta.value).catch(() => {
        ta.select();
        document.execCommand('copy');
      });
    });

    // ── keyboard ──────────────────────────────────────────────────────────────
    const IS_BLACK = [false, true, false, true, false, false, true, false, true, false, true, false];
    const WHITE_W  = 34, WHITE_H = 122, BLACK_W = 22, BLACK_H = 76;
    const START    = 48;  // C3
    const END      = 96;  // C7

    const kbEl = document.getElementById('keyboard');
    const whiteX = new Map();
    let wx = 0;
    for (let n = START; n <= END; n++) {
      if (!IS_BLACK[n % 12]) { whiteX.set(n, wx); wx += WHITE_W; }
    }
    kbEl.style.width  = wx + 'px';
    kbEl.style.height = WHITE_H + 'px';

    function makeKey(note, x, w, h, cls) {
      const el = document.createElement('div');
      el.className = `key ${cls}`;
      el.dataset.note = note;
      el.style.cssText = `left:${x}px; width:${w}px; height:${h}px;`;
      return el;
    }

    for (const [n, x] of whiteX) kbEl.appendChild(makeKey(n, x, WHITE_W, WHITE_H, 'white-key'));
    for (let n = START; n <= END; n++) {
      if (!IS_BLACK[n % 12]) continue;
      const px = whiteX.get(n - 1);
      if (px == null) continue;
      kbEl.appendChild(makeKey(n, px + WHITE_W - Math.floor(BLACK_W / 2), BLACK_W, BLACK_H, 'black-key'));
    }

    const heldNotes = new Set();

    function pressKey(note) {
      if (heldNotes.has(note)) return;
      heldNotes.add(note);
      instruments[activeIdx].noteOn(note, 0.8);
      kbEl.querySelector(`[data-note="${note}"]`)?.classList.add('pressed');
    }

    function releaseKey(note) {
      if (!heldNotes.has(note)) return;
      heldNotes.delete(note);
      instruments[activeIdx].noteOff(note);
      kbEl.querySelector(`[data-note="${note}"]`)?.classList.remove('pressed');
    }

    kbEl.addEventListener('mousedown', async e => {
      const key = e.target.closest('.key');
      if (!key) return;
      e.preventDefault();
      await ensureAudio();
      // Rebuild once per press session so slider edits are heard immediately,
      // but never during a drag (which caused hard cuts between notes).
      rebuildInstrument(activeIdx);
      pressKey(+key.dataset.note);
    });

    kbEl.addEventListener('mousemove', e => {
      if (e.buttons !== 1) return;
      const key = e.target.closest('.key');
      if (!key) return;
      const note = +key.dataset.note;
      for (const held of [...heldNotes]) if (held !== note) releaseKey(held);
      pressKey(note);
    });

    window.addEventListener('mouseup', () => {
      for (const note of [...heldNotes]) releaseKey(note);
    });

    // ── init ──────────────────────────────────────────────────────────────────
    loadInstrumentUI(0);
  </script>
</body>
</html>
